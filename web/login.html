<!DOCTYPE html>
<html lang="bn" class="lang-bn">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var l=localStorage.getItem("agroscan_lang")||"bn";if(l!=="en"&&l!=="bn")l="bn";var h=document.documentElement;h.lang=l==="en"?"en":"bn";h.classList.remove("lang-bn","lang-en");h.classList.add(l==="en"?"lang-en":"lang-bn");}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — AgroScan</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=85">
  <script src="/static/config.js?v=26"></script>
  <script src="/static/i18n.js?v=68"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-body" data-title-key="login_title">
  <div class="auth-shell">
    <div class="auth-topbar">
      <a href="/" class="auth-brand">
        <span class="logo-chip logo-chip-auth">
          <img src="/static/AgroScan_logo-main.png" alt="AgroScan" class="logo-img logo-img-white logo-img-auth-lg" />
        </span>
      </a>
      <button type="button" id="langToggle" class="icon-btn auth-lang" data-i18n-title="language" title="Language">বাং</button>
    </div>

    <div class="auth-card">
      <h1 data-i18n="login_h1">Welcome back</h1>
      <p class="auth-sub" data-i18n="login_sub">Sign in to save diagnosis history across devices.</p>

      <div id="authError" class="auth-error hidden"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <label class="field">
          <span data-i18n="field_email">Email</span>
          <input type="email" id="email" name="email" required autocomplete="email" data-i18n-ph="ph_email" placeholder="you@example.com">
        </label>
        <label class="field">
          <span data-i18n="field_password">Password</span>
          <div class="password-wrap">
            <input type="password" id="password" name="password" required autocomplete="current-password" data-i18n-ph="ph_password" placeholder="Password">
            <button type="button" class="password-toggle" data-target="password" aria-label="Show password" data-i18n-aria="show_password" title="Show password">
              <span class="pw-icon-show" aria-hidden="true">&#128065;</span>
              <span class="pw-icon-hide hidden" aria-hidden="true">&#128064;</span>
            </button>
          </div>
        </label>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_login">Log in</button>
      </form>

      <div class="auth-divider"><span data-i18n="or_divider">or</span></div>

      <div id="googleBtn" class="google-btn-wrap"></div>

      <button type="button" id="guestBtn" class="btn btn-secondary btn-block" data-i18n="guest_continue">Continue as Guest</button>
      <p class="auth-foot"><span data-i18n="no_account">No account?</span> <a href="/signup" data-i18n="create_one">Create one</a></p>
      <div style="display:flex;gap:8px;margin-top:14px">
        <a href="/admin" class="btn btn-secondary btn-sm" style="flex:1;text-align:center" data-i18n="ops_admin_signin">Admin sign-in</a>
        <a href="/vendor" class="btn btn-secondary btn-sm" style="flex:1;text-align:center" data-i18n="ops_vendor_signin">Vendor sign-in</a>
      </div>
    </div>
  </div>
  <script src="/static/auth.js?v=25"></script>
  <script>
    document.getElementById("langToggle").onclick = function () { window.AgroScanI18n.toggleLang(); };
  </script>
</body>
</html>
